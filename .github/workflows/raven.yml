name: raven-ai-humor

on:
  schedule:
    - cron: "17 */6 * * *"   # toutes les 6 h (UTC). GitHub peut décaler les passages.
  workflow_dispatch: {}       # bouton "Run workflow" pour lancer à la main
  push:                       # relance automatique quand le code ou la config change
    branches: [main]
    paths: [raven_humor.py, config.yaml, requirements.txt, .github/workflows/raven.yml]

permissions:
  contents: write             # pour committer la base SQLite et les rapports

concurrency:
  group: raven-ai-humor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Recherche, analyse et rapport
        env:
          TWEET_SOURCE: ${{ vars.TWEET_SOURCE || 'twitterapi_io' }}
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python raven_humor.py --config config.yaml

      - name: Sauvegarde de l'état (dédoublonnage, caches, registre) et des rapports
        if: always()
        run: |
          git config user.name "raven-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports || true
          git diff --cached --quiet || git commit -m "passage $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash || true
          git push
